[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qfso"
version = "0.1.0"
description = "Quantum Fourier Space Operations utilities."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mattia Robbiano, Giulio Crognaletti" }]
dependencies = [
  "numpy>=2.4.6",
  "galois>=0.4.11",
]

[project.urls]
Repository = "https://github.com/mattia-robbiano/qfso/"

[project.optional-dependencies]
coremath = [
  "scipy>=1.17.1",
]
iqp = [
  "jax>=0.10.1",
  "jaxlib>=0.10.1",
  "optax>=0.2.8",
  "quimb>=1.14.0",
  "numba>=0.65.1",
  "scipy>=1.17.1",
  "torch>=2.12.1",  # Aggiunto dato che è presente nell'ambiente iqp/deep learning
]
notebooks = [
  "matplotlib>=3.10.9",
  "jupyter>=1.0",
  "ipykernel>=7.2.0",
  "seaborn>=0.13.2",
]
all = [
  "scipy>=1.17.1",
  "jax>=0.10.1",
  "jaxlib>=0.10.1",
  "optax>=0.2.8",
  "quimb>=1.14.0",
  "numba>=0.65.1",
  "torch>=2.12.1",
  "matplotlib>=3.10.9",
  "jupyter>=1.0",
  "ipykernel>=7.2.0",
  "seaborn>=0.13.2",
]

[project.scripts]
qfso-ising = "qfso.distributions.generate.ising_generator:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["qfso*"]
exclude = ["notebooks*"]